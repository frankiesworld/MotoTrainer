<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bikes Trainer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>After 10 Moto Academy</h1>

    <section class="container-one">

    <h2>Track: Bakers West SX</h2>
    <h3>Session: 10 laps</h3>
    <h2>Results</h2>
    <div class="container-two">
    <div class="card">
            <p class="label">Fastest</p>
            <p id="fastest-time"></p>
        </div>
        <div class="card">
            <p class="label">Slowest</p>
            <p id="slowest-time"></p>
        </div>
        <div class="card">
            <p class="label">Average</p>
            <p id="average-time"></p>
        </div>
        <div class="card">
            <p class="label">Spread</p>
            <p id="spread-time"></p>
        </div>
        <div class="card">
            <p class="label">Coaches Notes</p>
            <p id="coaches-notes"></p>
        </div>
    </div>

    <div class="lap-entry">
        <label for="lap-input">Lap Time</label>
        <input id="lap-input" type="text" placeholder="1:07.532">
        <button id="add-lap-button">Add Lap</button>
    </div>

    <div class="lap-analysis">
        <h2>Lap Analysis</h2>

        <div id="lap-list"></div>
    </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
